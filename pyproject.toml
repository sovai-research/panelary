[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "panelary"
version = "0.5.0"
# One line, shown on the PyPI project page and in `pip show`. Keep it a claim we
# can defend: what it is (panel data), what is distinctive (leak-safe), and what
# it runs on (Polars). The brand tagline is "The best methods for panel data."
description = "The best methods for panel data: leak-safe feature engineering, econometrics and ML on Polars."
requires-python = ">=3.10"
authors = [{ name = "Sov.ai", email = "research@sov.ai" }]
readme = "README.md"
# PyPI search terms. Ordered from the defining idea outwards; each one should be
# something a user would plausibly type when looking for this library.
keywords = [
  "panel-data",
  "longitudinal-data",
  "polars",
  "feature-engineering",
  "time-series",
  "cross-sectional",
  "econometrics",
  "forecasting",
  "machine-learning",
  "data-leakage",
  "backtesting",
  "finance",
  "quant",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
# Light core: the mandatory footprint is numpy + polars only. Everything heavier
# (scikit-learn, scipy, flaml, holidays, tqdm, boosters, plotting, LLM, ...) is an
# optional extra below, imported lazily at first use via
# `panelary._deps.require`, which raises an actionable
# `pip install 'panelary[<extra>]'` hint when it is missing. The
# `recommended` extra restores the old batteries-included experience.
dependencies = [
  "numpy",
  "polars>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/sovai-research/panelary"
Repository = "https://github.com/sovai-research/panelary"
# The real docs site (mkdocs `site_url`), not the repo root.
Documentation = "https://sovai-research.github.io/panelary/"
# `HEAD` resolves to whatever the repository's default branch is, so this link
# cannot rot when the default branch is renamed (it is `Wenda`, not `main`).
Changelog = "https://github.com/sovai-research/panelary/blob/HEAD/CHANGELOG.md"
Issues = "https://github.com/sovai-research/panelary/issues"

[project.optional-dependencies]
# Extra names below intentionally mirror `panelary._deps._MODULE_TO_EXTRA`
# so the `require(...)` install hints ("pip install 'panelary[<extra>]'")
# always resolve to a real extra.

# --- classical ML: sklearn-backed estimators, selection, reduction, clustering.
# Everything in models/select/reduce/cluster imports sklearn lazily. ---
ml = ["scikit-learn>=1.2.2"]
# --- scientific kernels used by feature_extractors/catch22/evaluation/metrics. ---
scipy = ["scipy"]
# --- progress bars (forecasting loops); code degrades to a no-op without it. ---
progress = ["tqdm"]
# --- seasonality calendar/holiday effects (fourier terms stay dependency-free). ---
seasonality = ["holidays"]
# --- legacy autoregressive forecasting (functime-derived): FLAML `tune` for HPO. ---
forecasting = ["flaml>=2.0.2", "tqdm"]
# --- FLAML AutoML path (flaml_lightgbm): needs flaml[automl] + a booster.
# `_deps` maps the `flaml` module to `forecasting` (the common case, `flaml.tune`
# only), so a missing `flaml.AutoML` is hinted as [forecasting]; installing
# [automl] is the fix, and it is a superset. ---
automl = ["flaml[automl]>=2.0.2", "lightgbm"]
# --- gradient-boosting back-ends (each optional, additive) for forecasting/models. ---
lightgbm = ["lightgbm"]
catboost = ["catboost"]
xgboost = ["xgboost"]
# --- approximate-nearest-neighbour retrieval (panelary/forecasting/lance.py).
# The distribution is `pylance`; the module it installs is `lance`. That module
# is imported at module scope there, not through `_deps.require`, so this extra
# has no `_MODULE_TO_EXTRA` row. ---
ann = ["pylance"]
# --- optional JIT acceleration for the pure-Python CUSUM change-point kernel. ---
fast = ["numba"]
# LLM-assisted features. The current code targets the OpenAI SDK; anthropic is
# included as the recommended provider going forward.
llm = ["openai", "anthropic", "tiktoken", "tenacity"]
# GPU acceleration. Polars exposes its GPU engine via the collect engine
# (`.collect(engine="gpu")`), which pulls in the cudf-polars backend.
gpu = ["cudf-polars-cu12"]
# Plotting utilities (see panelary/plotting.py -> plotly).
viz = ["plotly"]
# CAFE imputation backend (cafe_impute / CafeImputer). MIT, Sov.ai.
cafe = ["cafe-impute>=0.1"]
# Non-linear dimensionality reduction (reduce.PanelUMAP). PCA/SVD/FA/NMF use the
# `ml` extra's scikit-learn; only UMAP needs this extra.
dimreduce = ["umap-learn>=0.5"]
# --- feature attribution (panelary.explain). The v1 TreeAttributor path
# uses the boosters' own native exact TreeSHAP and needs nothing here; `shap`
# provides the sklearn/interventional fallback and `shapiq` the any-order
# Shapley interaction indices. ---
explain = ["shap>=0.44", "shapiq>=1.0"]
# Batteries-included bundle: the common heavy deps that reproduce the old
# effective feature set (minus GPU / niche back-ends). Restores the pre-slim
# experience for users who want `pip install` to "just work".
recommended = ["panelary[ml,scipy,seasonality,cafe]"]
# The kitchen sink: every user-facing feature extra above (self-referential
# extras require pip>=21.2). Only the tooling extras -- `dev` and `docs` -- are
# deliberately left out; they are for working *on* Panelary, not with it.
# Keep this list in sync when a feature extra is added.
all = [
  "panelary[ml,scipy,progress,seasonality,forecasting,automl,lightgbm,catboost,xgboost,ann,fast,llm,gpu,viz,cafe,dimreduce,explain]",
]
# Documentation toolchain (mkdocs-material site under docs/, config in
# mkdocs.yml). Kept out of `dev` so test/lint CI stays lean; the docs workflow
# installs `.[docs]`. Upper bounds are deliberate: MkDocs 2.0 / Material 10 are
# announced as backward-incompatible (plugin system + theme overrides removed),
# and this site uses both plugins and a `docs/overrides` custom_dir.
docs = [
  "mkdocs>=1.6.1,<2",
  "mkdocs-material>=9.5,<10",
  "mkdocstrings>=1.0,<2",
  "mkdocstrings-python>=2.0,<3",
  "mkdocs-jupyter>=0.25,<1",
  "pymdown-extensions>=10.0",
]

# Development / CI tooling.
dev = [
  # Pinned to match `uvx ruff@0.15.10` in .github/workflows/ci.yml and the rev
  # in .pre-commit-config.yaml. An unpinned floor let contributors format with
  # a newer ruff whose output CI's older ruff then rejected.
  "ruff==0.16.7",
  "pytest>=8.0",
  "hypothesis>=6.0",
  "mypy>=1.8",
  "pre-commit>=3.5",
  # `tests/test_dependency_drift.py` parses pyproject.toml. 3.11+ has `tomllib`
  # in the stdlib; 3.10 needs this backport. It was never declared, so on the
  # three Python 3.10 CI legs that guardrail silently collected ZERO tests --
  # `pytest.importorskip("tomli")` at module scope skipped the whole module.
  "tomli>=2.0; python_version < '3.11'",
  # Parallel test execution: the suite is 1600+ tests and runs ~14x
  # faster with `-n auto` (measured: 15+ min serial -> 67 s on 8 cores).
  "pytest-xdist>=3.5",
  # The `benchmark` fixture is used by tests/test_cross_validation.py and
  # tests/test_benchmarks.py. It was never declared, so those tests only
  # passed on machines that happened to have it installed.
  "pytest-benchmark>=4.0",
]

[tool.hatch.build.targets.wheel]
# Pure-Python distribution: one universal py3-none-any wheel, no compiler needed.
packages = ["panelary"]

[tool.hatch.build.targets.sdist]
include = ["panelary", "README.md", "LICENSE", "NOTICE", "CHANGELOG.md"]

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["*.ipynb", "docs/notebooks/**"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "SIM", # flake8-simplify
  "C4",  # flake8-comprehensions
  "W",   # pycodestyle warnings
]
ignore = [
  "E501", # line length handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "E402"]
# E402: tests guard optional-dependency imports with
# `pytest.importorskip(...)`, which must run BEFORE the import it guards.
"tests/**" = ["B", "F401", "F811", "E402"]

[tool.ruff.lint.isort]
known-first-party = ["panelary"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "benchmark: marks tests as benchmarks",
  "multivariate: marks tests that exercise multivariate forecasting",
]

[tool.mypy]
# `ty` (astral) is the preferred type checker going forward, but mypy config is
# kept as the portable fallback that runs everywhere today.
# `python_version` is deliberately UNSET, so mypy targets whichever interpreter
# it runs under. It used to be pinned to "3.10" (our floor), but `python_version`
# also selects the *parser*: under 3.10 rules mypy cannot read numpy's own
# bundled stubs, which use a PEP 695 `type` statement
# (`numpy/__init__.pyi:737: Type statement is only supported in Python 3.12 and
# greater`). That is a syntax error, so mypy aborted before checking anything --
# `make typecheck`, and therefore the documented `make check` gate, was dead for
# every contributor on 3.12+ while CI hid it by pinning 3.10 for that one job.
# The alternatives were worse: pinning "3.12"/"3.13" drops 3.10 checking for
# everyone including CI, and silencing the numpy stubs (`follow_imports = skip`)
# would turn every ndarray into `Any` -- a real loss of coverage to work around
# a parser flag. Unset, the 3.10 semantics we care about are still enforced,
# just by the CI matrix: the mypy job installs Python 3.10 (see
# `.github/workflows/ci.yml`), so 3.11+-only syntax or stdlib still fails there.
files = ["panelary"]
warn_unused_ignores = true
# The optional back-ends (sklearn, scipy, flaml, plotly, boosters, ...) are not
# installed in every environment and several ship no stubs, so missing-import
# errors would be noise rather than signal. CI ratchets the remaining error
# count instead (MYPY_BASELINE in .github/workflows/ci.yml).
ignore_missing_imports = true

