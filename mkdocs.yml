site_name: Panelary
site_description: "The best methods for panel data. Panelary is a Polars-native, leak-safe toolkit for feature engineering and ML on panel data, built on the foundations of functime (Apache-2.0, actively maintained)."
site_url: https://sovai-research.github.io/panelary/
repo_url: https://github.com/sovai-research/panelary
repo_name: sovai-research/panelary
copyright: "Apache-2.0, Sov.ai. Derived from functime (Apache-2.0)."

theme:
  name: "material"
  custom_dir: docs/overrides
  icon:
    repo: fontawesome/brands/github
  favicon: img/logo_dark.png
  logo: img/logo.png
  palette:
    primary: black
  features:
    - content.code.copy
    - content.tabs.link
    - navigation.expand

plugins:
  - search:
      lang: en
  - mkdocs-jupyter:
      include: ["*.ipynb"]
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_source: false
            show_bases: false
  # If available, enable an llms.txt plugin to generate an LLM-friendly site
  # summary for coding agents (see https://llmstxt.org). A hand-written
  # `llms.txt` already lives at the repo root.
  # - mkdocs-llmstxt

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true

